<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="A responsive weather app using JavaScript, Fetch API, OpenWeatherMap, localStorage, and a dark UI.">

  <title>Nexsoft Weather App | City Weather Lookup</title>

  <link rel="canonical" href="https://fazal305.github.io/nexsoft-weather-app/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fazal305.github.io/nexsoft-weather-app/">
  <meta property="og:title" content="Nexsoft Weather App | City Weather Lookup">
  <meta property="og:description"
    content="A responsive weather app using JavaScript, Fetch API, OpenWeatherMap, localStorage, and a dark UI.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nexsoft Weather App | City Weather Lookup">
  <meta name="twitter:description"
    content="A responsive weather app using JavaScript, Fetch API, OpenWeatherMap, localStorage, and a dark UI.">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app-wrapper">
    <section class="weather-app" aria-label="Weather app">
      <header class="app-header">
        <p class="brand-label">Fazal Labs · BrowserLab</p>
        <h1>Nexsoft Weather App</h1>
        <p class="app-subtitle">Search current weather by city name.</p>
        <button id="apiKeyButton" type="button" class="api-key-link">Set OpenWeatherMap API key</button>
      </header>

      <div id="apiKeyBox" class="api-key-box hidden">
        <label class="sr-only" for="apiKeyInput">OpenWeatherMap API key</label>
        <input type="text" id="apiKeyInput" placeholder="Paste your API key" autocomplete="off">
        <button id="apiKeySave" type="button">Save</button>
        <p class="api-key-hint">
          Free at <a href="https://home.openweathermap.org/users/sign_up" target="_blank" rel="noopener">openweathermap.org</a>.
          Stored only in your browser (localStorage) — never sent anywhere but OpenWeatherMap.
        </p>
      </div>

      <div class="search-box">
        <label class="sr-only" for="cityInput">City name</label>

        <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off">

        <button id="searchButton" type="button">Search</button>
      </div>

      <p id="messageText" class="message-text" aria-live="polite"></p>

      <div id="loadingBox" class="loading-box hidden" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Fetching weather...</p>
      </div>

      <section id="weatherCard" class="weather-card hidden" aria-label="Weather result">
        <h2 id="locationText"></h2>

        <img id="weatherIcon" class="weather-icon" src="" alt="Weather icon">

        <p id="temperatureText" class="temperature-text"></p>
        <p id="conditionText" class="condition-text"></p>

        <div class="weather-details">
          <div>
            <span>Feels Like</span>
            <strong id="feelsLikeText"></strong>
          </div>

          <div>
            <span>Humidity</span>
            <strong id="humidityText"></strong>
          </div>

          <div>
            <span>Wind Speed</span>
            <strong id="windText"></strong>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
